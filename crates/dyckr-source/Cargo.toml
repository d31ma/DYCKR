[package]
name = "dyckr-source"
description = "Shared rules that read, check and lower Tac and Yon source code in every supported language"
version = "0.0.0-phase4"
edition = "2024"
rust-version = "1.97.1"
authors = ["Tachyon Contributors"]
license = "MIT"
publish = false

[dependencies]
dyckr = { path = "../dyckr" }
tachyon-contracts = { path = "../tachyon-contracts" }
tachyon-diagnostics = { path = "../tachyon-diagnostics" }
tachyon-duplication = { path = "../tachyon-duplication" }
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "process", "rt", "sync", "time"] }

[features]
test-support = []

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
