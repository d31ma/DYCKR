[package]
name = "dyckr"
version = "0.0.0-phase4"
edition = "2024"
rust-version = "1.97.1"
authors = ["Tachyon Contributors"]
license = "MIT"

[features]
json-preserve-order = ["serde_json/preserve_order"]

[dependencies]
tachyon-diagnostics = { path = "../tachyon-diagnostics" }
tachyon-contracts = { path = "../tachyon-contracts" }
command-group = { version = "5.0.1", features = ["with-tokio"] }
sha2 = "0.10"
tempfile = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
notify = "8.0.0"
cap-std = "4.0.2"
url = "2.5.8"
tokio = { version = "1.53.1", features = ["rt", "io-util", "process", "sync", "time", "macros"] }
